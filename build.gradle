plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods must target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir('src/generated/resources')          // datagen output (harmless if unused)
    exclude('src/generated/**/.cache')
}

repositories {
    // MDG adds the NeoForged and Parchment repos automatically. Nothing needed here.
}

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion  = project.parchment_mappings_version
    }

    // Fail the build on bad AT targets if an accesstransformer.cfg is ever added.
    validateAccessTransformers = true

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output',   file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        // Standalone GameTest server (`./gradlew runGameTestServer`). Removed in Phase 1
        // because it crashes when zero gametests are registered — re-added now that the
        // ECON-02 suite exists (plan 02-01 Task 3). Currently RED; plan 02-02 turns it GREEN.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            // "REGISTRIES" logs each registry event as it fires — the single most useful
            // marker for diagnosing unbound-DeferredHolder crashes.
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Expand ${...} placeholders in src/main/templates into the built resources.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// --- deployToTest (D-01..D-04, D-06) --------------------------------------------
// On-demand only: `dependsOn build`, never wired into build/assemble/check, and
// nothing dependsOn it. Copies the freshly built jar into the CurseForge "test"
// instance mods/ folder, replacing the previous secondshift-*.jar. A failed deploy
// fails loudly and never touches build/libs/. Config-cache-safe: the destination
// path, the built jar, and mod_id are all captured at configuration time and the
// execution action never references `project`.
def deployDestProvider = providers.gradleProperty('test_instance_mods_dir')
def deployJarProvider = tasks.named('jar', Jar).flatMap { it.archiveFile }
def deployModId = mod_id

tasks.register('deployToTest') {
    group = 'second shift'
    description = 'Deploys the freshly built jar into the CurseForge "test" instance mods/ folder, on demand. Never run automatically.'
    dependsOn tasks.named('build')

    def destPathProvider = deployDestProvider
    def jarFileProvider = deployJarProvider
    def modId = deployModId

    doLast {
        if (!destPathProvider.isPresent()) {
            throw new GradleException(
                "deployToTest: test instance mods dir not found: (test_instance_mods_dir is unset). " +
                "Set test_instance_mods_dir in gradle.properties or create the folder, then re-run.")
        }
        def destDir = new File(destPathProvider.get())
        if (!destDir.isDirectory()) {
            throw new GradleException(
                "deployToTest: test instance mods dir not found: ${destDir}. " +
                "Set test_instance_mods_dir in gradle.properties or create the folder, then re-run.")
        }

        def src = jarFileProvider.get().asFile
        try {
            // Glob-delete only "<modId>-*.jar" — never a bare *.jar, never the dashed
            // "second-shift-*.jar" (D-05), never recursive.
            def stale = destDir.listFiles({ File dir, String name ->
                name ==~ /\Q${modId}\E-.*\.jar/
            } as FilenameFilter)
            stale?.each { f ->
                if (!f.delete()) {
                    throw new IOException("could not delete stale jar ${f}")
                }
            }
            java.nio.file.Files.copy(
                src.toPath(),
                new File(destDir, src.name).toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        } catch (IOException e) {
            throw new GradleException(
                "deployToTest: could not write to ${destDir} - close Minecraft (it locks mods/*.jar) " +
                "and re-run. build/libs/${src.name} is unchanged.", e)
        }

        println "deployToTest: deployed ${src.name} -> ${destDir.absolutePath}"
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
