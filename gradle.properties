org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment (verified present on maven.parchmentmc.org)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment — must match the CurseForge "test" instance exactly
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.248
# Deliberate split: compile against neo_version, but declare a runtime range of
# [21.1,) so a patch rollback of the instance does not brick the jar. The stock
# MDK writes "[${neo_version},)" which pins to >= 21.1.248.
neo_version_range=[21.1,)
loader_version_range=[1,)

## Mod Properties
mod_id=secondshift
mod_name=Second Shift
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.cxmxrgo.secondshift

# Committed personal-machine config (D-06). Read by the deployToTest task.
# Not gitignored — no local override.
test_instance_mods_dir=C:/Users/user/curseforge/minecraft/Instances/test/mods
